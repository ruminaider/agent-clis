name: agent-ledger release

# Publish a GitHub Release with darwin/linux x arm64/amd64 archives
# when an agent-ledger v* tag is pushed. Tag the kernel module with
# `v<semver>` (e.g. v0.1.0). Snapshot smoke continues to run on every
# PR via agent-ledger-release-snapshot.yml.
#
# Note on tag scope: the parent monorepo also hosts notion-cli and
# linear-cli, which use their own tag prefixes (notion-cli-v*,
# linear-cli-v*). This workflow only fires on plain v* tags, which we
# reserve for agent-ledger releases.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write   # required for goreleaser to create the GitHub Release

jobs:
  release:
    name: goreleaser publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # goreleaser needs full history to derive the version

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: agent-ledger/go.sum

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
          workdir: agent-ledger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CGO_ENABLED: "0"
