name: release-snapshot

# Smoke-build the four-target snapshot on every pull request and on
# manual dispatch, without publishing. Real releases live in
# release.yml and trigger on v* tag pushes.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    name: goreleaser snapshot
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-ledger
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Run goreleaser (snapshot)
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
          workdir: agent-ledger
        env:
          CGO_ENABLED: "0"

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agent-ledger-snapshot
          path: agent-ledger/dist/*
          if-no-files-found: error
